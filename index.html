<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eceae6">
<link rel="manifest" href="./manifest.webmanifest">
<title>Kotoba Writer</title>
<style>
:root{
  --font-size:18px; --line-height:1.9; --chars:40; --lines:30;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  color:#202020;background:#d8d7d4;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8d7d4}
body{position:fixed;left:0;right:0;top:var(--viewport-top,0px);height:var(--viewport-height,100dvh);display:flex;flex-direction:column}
.topbar,.toolbar,.statusbar{flex-shrink:0}
button,select,input{font:inherit}
button{border:1px solid #c9c7c2;border-radius:9px;background:#fff;color:#222;padding:8px 11px;font-weight:600}
button.primary{background:#222;color:#fff;border-color:#222}
button:disabled{opacity:.45}
.topbar{
  position:relative;top:auto;z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:max(9px,env(safe-area-inset-top)) 10px 9px;background:rgba(246,245,242,.96);
  border-bottom:1px solid #c9c7c2;backdrop-filter:blur(10px)
}
.title{font-weight:800}.spacer{flex:1}
.toolbar{
  position:relative;top:auto;z-index:19;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:8px 10px;background:#efede9;border-bottom:1px solid #ccc9c3
}
.toolbar label{display:flex;align-items:center;gap:5px;font-size:13px;color:#555}
.toolbar select,.toolbar input[type=number]{background:white;border:1px solid #cbc8c0;border-radius:8px;padding:7px}
.toolbar input[type=number]{width:68px}
.presetbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.presetbar button{padding:6px 9px;font-size:12px}
.workspace{flex:1;min-height:0;padding:28px 10px 40px;overflow:auto;overscroll-behavior:contain;overflow-anchor:none;scroll-behavior:auto}
.pages{display:flex;flex-direction:column;gap:26px;align-items:flex-start;min-width:max-content}
.page{
  position:relative;background:#fff;box-shadow:0 2px 13px rgba(0,0,0,.16);
  padding:56px 58px;border-radius:2px;width:max-content;margin-inline:auto;flex-shrink:0;
}
.page::after{
  content:attr(data-page);position:absolute;right:16px;bottom:12px;font-size:11px;color:#999;
}
.page-editor{
  display:block;margin:0;padding:0;border:0;outline:0;resize:none;background:transparent;color:#171717;
  font-size:var(--font-size);line-height:var(--line-height);
  font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  font-kerning:none;font-variant-east-asian:full-width;
  letter-spacing:0;caret-color:#111;white-space:pre-wrap;overflow:hidden;
  line-break:anywhere;word-break:break-all;box-sizing:content-box;
  width:calc(var(--chars) * 1em);
  height:calc(var(--lines) * var(--font-size) * var(--line-height));
}
.page.vertical .page-editor{
  writing-mode:vertical-rl;text-orientation:mixed;
  width:calc(var(--lines) * var(--font-size) * var(--line-height));
  height:calc(var(--chars) * 1em);
}
.page.manuscript:not(.vertical) .page-editor{
  background-image:
    linear-gradient(to right,rgba(0,0,0,.065) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(0,0,0,.065) 1px,transparent 1px);
  background-size:1em calc(var(--font-size) * var(--line-height));
}
.page.manuscript.vertical .page-editor{
  background-image:
    linear-gradient(to right,rgba(0,0,0,.065) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(0,0,0,.065) 1px,transparent 1px);
  background-size:calc(var(--font-size) * var(--line-height)) 1em;
}
.statusbar{
  position:relative;left:auto;right:auto;bottom:auto;z-index:30;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  padding:8px 12px max(8px,env(safe-area-inset-bottom));background:rgba(246,245,242,.96);
  border-top:1px solid #c9c7c2;font-size:12px;color:#555;backdrop-filter:blur(10px)
}
.build{margin-left:auto;font-weight:700}
.panel{
  position:fixed;inset:auto 12px calc(52px + env(safe-area-inset-bottom)) 12px;z-index:40;
  background:#fff;border:1px solid #ccc;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);
  padding:14px;display:none;max-width:760px;margin:auto
}
.panel.show{display:block}.panel h3{margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row input[type=text]{flex:1;min-width:150px;border:1px solid #bbb;border-radius:9px;padding:9px}
.note{font-size:12px;color:#666;line-height:1.5;margin-top:8px}
.result{margin-top:10px;padding:12px;border-radius:10px;background:#f3f1ed;white-space:pre-wrap;max-height:30vh;overflow:auto}
.privacy-btn.on{background:#153d24;color:#fff;border-color:#153d24}
.privacy-banner{
  display:none;max-width:980px;margin:10px auto 0;padding:9px 12px;background:#e8f3eb;border:1px solid #b9d7c1;
  border-radius:10px;font-size:12px;color:#21482c
}
.privacy-banner.show{display:block}
#fileInput,#printArea{display:none}
@media(max-width:700px){
  .toolbar{top:auto}.workspace{padding-top:16px}.page{padding:38px 24px}.pages{align-items:flex-start}
}
@media print{
  .topbar,.toolbar,.statusbar,.panel,.privacy-banner{display:none!important}
  html,body{position:static!important;height:auto!important;overflow:visible!important}body,.workspace{background:white!important;padding:0!important}.pages{display:none!important}
  #printArea{display:block!important;white-space:pre-wrap;font-family:"Yu Mincho",serif;font-size:12pt;line-height:1.8}
  @page{size:A4;margin:18mm}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="title">Kotoba Writer</div>
  <button id="newBtn">新規</button>
  <button id="undoBtn" disabled>取り消し</button>
  <button id="openBtn">TXTを開く</button>
  <button id="saveBtn">TXT保存</button>
  <button id="pdfBtn">PDF / 印刷</button>
  <div class="spacer"></div>
  <button id="findBtn">検索・置換</button>
  <button id="formatBtn">体裁を整える</button>
  <button id="aiBtn">AI軽推敲</button>
  <button id="privacyBtn" class="privacy-btn">秘匿モード OFF</button>
</div>

<div class="toolbar">
  <label>文字サイズ
    <select id="fontSize">
      <option>14</option><option>16</option><option selected>18</option><option>20</option><option>22</option><option>24</option><option>28</option>
    </select>
  </label>
  <label>行間
    <select id="lineHeight">
      <option value="1.5">狭い</option><option value="1.7">やや狭い</option><option value="1.9" selected>標準</option><option value="2.1">広い</option><option value="2.3">かなり広い</option>
    </select>
  </label>
  <label>表示
    <select id="writingMode"><option value="horizontal">横書き</option><option value="vertical">縦書き</option></select>
  </label>
  <label><span id="charsLabel">1行の文字数</span><input id="charCount" type="number" min="10" max="60" value="40"></label>
  <label><span id="linesLabel">行数</span><input id="lineCount" type="number" min="10" max="50" value="30"></label>
  <label><input id="manuscript" type="checkbox"> マス目</label>
  <label><input id="indent" type="checkbox" checked> 段落頭を一字下げ</label>
  <div class="presetbar">
    <span style="font-size:12px;color:#666">プリセット</span>
    <button data-preset="40,30">40×30</button>
    <button data-preset="42,34">42×34</button>
    <button data-preset="20,20">20×20</button>
  </div>
</div>

<div id="privacyBanner" class="privacy-banner">秘匿モードON：ネット取得をキャッシュ限定にしています。</div>
<div class="workspace"><div id="pages" class="pages"></div></div>

<div class="statusbar">
  <span id="saveStatus">自動保存</span>
  <span id="count">0文字</span>
  <span id="cursor">1ページ 1行 1列</span>
  <span id="pageInfo">40字 × 30行</span>
  <span id="pageCount">1ページ</span>
  <span class="build">Kotoba Writer build 6</span>
</div>

<div id="findPanel" class="panel">
  <h3>検索・置換</h3>
  <div class="row">
    <input id="findText" type="text" placeholder="検索する文字">
    <button id="nextBtn">次へ</button><span id="findInfo" class="note"></span>
  </div>
  <div class="row" style="margin-top:8px">
    <input id="replaceText" type="text" placeholder="置換後の文字">
    <button id="replaceOneBtn">1件置換</button>
    <button id="replaceAllBtn">すべて置換</button>
    <button id="goMatchBtn" disabled>本文で確認</button>
    <button id="closeFind">閉じる</button>
  </div>
  <div id="searchPreview" class="result">検索結果をここに表示します。</div>
</div>

<div id="aiPanel" class="panel">
  <h3>AI軽推敲</h3>
  <div class="row">
    <button id="prepareAI" class="primary">AIを準備</button>
    <button id="runAI" disabled>現在位置を軽推敲</button>
    <button id="applyAI" disabled>候補を反映</button>
    <button id="closeAI">閉じる</button>
  </div>
  <div id="aiStatus" class="note">設定や描写を増やさず、最小限だけ整えます。</div>
  <div id="aiResult" class="result">候補はここに表示されます。</div>
</div>

<input id="fileInput" type="file" accept=".txt,text/plain">
<div id="printArea"></div>

<script type="module">
const BUILD=6;
const $=id=>document.getElementById(id);
const STORAGE='kotoba-writer-draft-v1';
const SETTINGS='kotoba-writer-settings-v1';
const MODEL='Qwen2.5-0.5B-Instruct-q4f16_1-MLC';
const CDN='https://esm.run/@mlc-ai/web-llm@0.2.82';

let docText=localStorage.getItem(STORAGE)||'';
let chunks=[];
let globalCaret=0, globalSelEnd=0;
let history=[];
let isComposing=false;
const graphemes=new Intl.Segmenter('ja',{granularity:'grapheme'});
function units(text){return Array.from(graphemes.segment(text));}
function previousOffset(pos){const a=units(docText.slice(0,pos));return a.length?a[a.length-1].index:0;}
function nextOffset(pos){const a=units(docText.slice(pos));return pos+(a[0]?.segment.length||0);}
let rendering=false;
let revealFrame=0;
function viewportChanged(){
  const vv=window.visualViewport;
  document.documentElement.style.setProperty('--viewport-height',(vv?.height||innerHeight)+'px');
  document.documentElement.style.setProperty('--viewport-top',(vv?.offsetTop||0)+'px');
  scheduleReveal();
}
window.visualViewport?.addEventListener('resize',viewportChanged);
window.visualViewport?.addEventListener('scroll',viewportChanged);
window.addEventListener('resize',viewportChanged);
// Scroll only enough to expose the actual caret, never center the entire sheet.
function scheduleReveal(){
  cancelAnimationFrame(revealFrame);
  revealFrame=requestAnimationFrame(()=>{
    const ta=document.activeElement;
    if(!ta?.classList.contains('page-editor')||isComposing)return;
    const workspace=document.querySelector('.workspace');
    const mirror=document.createElement('div');
    const style=getComputedStyle(ta);
    for(const key of ['fontFamily','fontSize','fontWeight','lineHeight','letterSpacing','writingMode','textOrientation','wordBreak','lineBreak','whiteSpace','fontKerning','fontVariantEastAsian','tabSize'])mirror.style[key]=style[key];
    Object.assign(mirror.style,{position:'fixed',left:'0',top:'0',width:style.width,height:style.height,visibility:'hidden',pointerEvents:'none'});
    mirror.textContent=ta.value.slice(0,ta.selectionStart);
    const marker=document.createElement('span');marker.textContent='\u200b';mirror.append(marker);
    mirror.append(document.createTextNode(ta.value.slice(ta.selectionStart)||'\u200b'));
    document.body.append(mirror);
    const m=marker.getBoundingClientRect(),base=mirror.getBoundingClientRect(),rect=ta.getBoundingClientRect(),view=workspace.getBoundingClientRect();
    const left=rect.left+m.left-base.left,top=rect.top+m.top-base.top;
    const right=left+Math.max(2,m.width),bottom=top+Math.max(parseFloat(style.fontSize),m.height);
    mirror.remove();
    const dx=left<view.left+12?left-view.left-12:right>view.right-12?right-view.right+12:0;
    const dy=top<view.top+12?top-view.top-12:bottom>view.bottom-12?bottom-view.bottom+12:0;
    if(dx||dy)workspace.scrollBy({left:dx,top:dy,behavior:'instant'});
  });
}
let searchPos=0,currentMatch=null,lastSearchQuery='';
let aiEngine=null,webllm=null,aiRange=null,aiSnapshot=null;
let privacyMode=localStorage.getItem('kotoba-writer-privacy')==='1';

function clamp(n,a,b,f){n=parseInt(n,10);return Number.isNaN(n)?f:Math.max(a,Math.min(b,n))}
function getSettings(){
  return {
    fontSize:$('fontSize').value,
    lineHeight:$('lineHeight').value,
    writingMode:$('writingMode').value,
    charCount:clamp($('charCount').value,10,60,40),
    lineCount:clamp($('lineCount').value,10,50,30),
    manuscript:$('manuscript').checked,
    indent:$('indent').checked
  };
}
function saveSettings(){localStorage.setItem(SETTINGS,JSON.stringify(getSettings()))}
function loadSettings(){
  try{
    const s=JSON.parse(localStorage.getItem(SETTINGS)||'{}');
    if(s.fontSize)$('fontSize').value=s.fontSize;
    if(s.lineHeight)$('lineHeight').value=s.lineHeight;
    if(s.writingMode)$('writingMode').value=s.writingMode;
    if(s.charCount)$('charCount').value=s.charCount;
    if(s.lineCount)$('lineCount').value=s.lineCount;
    $('manuscript').checked=!!s.manuscript;
    $('indent').checked=s.indent!==false;
  }catch{}
}
function save(){
  try{localStorage.setItem(STORAGE,docText);$('saveStatus').textContent='保存済み'}
  catch{$('saveStatus').textContent='保存エラー'}
}
function remember(){
  if(history.length && history[history.length-1]===docText)return;
  history.push(docText); if(history.length>20)history.shift();
  $('undoBtn').disabled=!history.length;
}
function applySettings(){
  const s=getSettings();
  $('charCount').value=s.charCount;$('lineCount').value=s.lineCount;
  document.documentElement.style.setProperty('--font-size',s.fontSize+'px');
  document.documentElement.style.setProperty('--line-height',s.lineHeight);
  document.documentElement.style.setProperty('--chars',s.charCount);
  document.documentElement.style.setProperty('--lines',s.lineCount);
  const v=s.writingMode==='vertical';
  $('charsLabel').textContent=v?'1列の文字数':'1行の文字数';
  $('linesLabel').textContent=v?'列数':'行数';
  $('pageInfo').textContent=v?`${s.charCount}字 × ${s.lineCount}列`:`${s.charCount}字 × ${s.lineCount}行`;
  saveSettings();
  renderPages(globalCaret,globalSelEnd,false);
}

/* 文字数と明示改行からページを決める。
   Safariのtextarea内部スクロールにページ管理を任せない。 */
function paginate(text){
  const {charCount:cols,lineCount:rows}=getSettings();
  const out=[];
  let pageStart=0,row=0,col=0;
  const chars=units(text);
  for(let k=0;k<chars.length;k++){
    const {segment:ch,index:i}=chars[k];
    if(ch==='\n'){row++;col=0;}
    else{if(col===cols){row++;col=0;}col++;}
    let end=i+ch.length;
    if(row>=rows || (row===rows-1 && col===cols)){
      // A newline immediately after a full final line belongs to that line.
      if(col===cols && chars[k+1]?.segment==='\n'){end++;k++;}
      out.push({start:pageStart,end,text:text.slice(pageStart,end)});
      pageStart=end;row=0;col=0;
    }
  }
  out.push({start:pageStart,end:text.length,text:text.slice(pageStart)});
  if(!out.length)out.push({start:0,end:0,text:''});
  return out;
}
function pageForOffset(pos){
  pos=Math.max(0,Math.min(pos,docText.length));
  for(let i=0;i<chunks.length;i++){
    const c=chunks[i];
    if(pos>=c.start && (pos<c.end || i===chunks.length-1))return i;
  }
  return Math.max(0,chunks.length-1);
}
function lineCol(text,pos){
  const {charCount:cols}=getSettings();
  let row=1,col=1;
  for(const {segment:ch} of units(text.slice(0,pos))){
    if(ch==='\n'){row++;col=1;}
    else{if(col>cols){row++;col=1;}col++;}
  }
  return {row,col};
}
function updateStatus(){
  $('count').textContent=docText.length+'文字';
  const p=pageForOffset(globalCaret);
  const c=chunks[p]||{start:0,text:''};
  const lc=lineCol(c.text,globalCaret-c.start);
  const vertical=getSettings().writingMode==='vertical';
  $('cursor').textContent=vertical
    ?`${p+1}ページ ${lc.row}列 ${lc.col}字`
    :`${p+1}ページ ${lc.row}行 ${lc.col}列`;
  $('pageCount').textContent=chunks.length+'ページ';
}
function pageClass(){
  const s=getSettings();
  return 'page'+(s.writingMode==='vertical'?' vertical':'')+(s.manuscript?' manuscript':'');
}
function bindEditor(ta){
  if(ta.dataset.bound)return;
  ta.dataset.bound='1';

  ta.addEventListener('compositionstart',()=>{isComposing=true;remember()});
  ta.addEventListener('compositionend',()=>{isComposing=false;syncFromPage(ta,true)});
  for(const type of ['focus','click','select','keyup'])ta.addEventListener(type,()=>{if(!rendering && document.activeElement===ta)syncCaret(ta)});
  ta.addEventListener('beforeinput',e=>{
    if(isComposing||e.isComposing)return;
    if(handleEdit(e,ta,e.inputType))return;
    remember();
  });
  ta.addEventListener('input',e=>{
    if(document.activeElement!==ta)return;
    if(isComposing||e.isComposing){saveComposition(ta);return;}
    syncFromPage(ta,true);
  });
  ta.addEventListener('keydown',e=>{
    if(isComposing||e.isComposing||e.keyCode===229)return;
    const type={Enter:'insertLineBreak',Backspace:'deleteContentBackward',Delete:'deleteContentForward'}[e.key];
    if(type && handleEdit(e,ta,type))return;
    const c=chunks[+ta.dataset.index];if(!c||e.shiftKey)return;
    const vertical=getSettings().writingMode==='vertical';
    const backward=vertical?'ArrowUp':'ArrowLeft',forward=vertical?'ArrowDown':'ArrowRight';
    if(ta.selectionStart!==ta.selectionEnd)return;
    if(e.key===backward && ta.selectionStart===0 && c.start>0){
      e.preventDefault();renderPages(previousOffset(c.start),previousOffset(c.start),true,true);
    }else if(e.key===forward && ta.selectionEnd===ta.value.length && c.end<docText.length){
      e.preventDefault();renderPages(c.end,c.end,true,true);
    }
  });
}
function saveComposition(ta){
  const c=chunks[+ta.dataset.index];if(!c)return;
  // Persist provisional input without changing the DOM or offsets during IME.
  try{localStorage.setItem(STORAGE,docText.slice(0,c.start)+ta.value+docText.slice(c.end));}catch{}
}
function handleEdit(event,ta,type){
  const c=chunks[+ta.dataset.index];if(!c||!event.cancelable)return false;
  let start=c.start+ta.selectionStart,end=c.start+ta.selectionEnd,text='';
  if(type==='insertLineBreak'||type==='insertParagraph')text='\n';
  else if(type==='deleteContentBackward' && start===end && ta.selectionStart===0 && start>0)start=previousOffset(start);
  else if(type==='deleteContentForward' && start===end && ta.selectionEnd===ta.value.length && end<docText.length)end=nextOffset(end);
  else return false;
  event.preventDefault();remember();
  docText=docText.slice(0,start)+text+docText.slice(end);
  save();renderPages(start+text.length,start+text.length,true,true);
  return true;
}

function syncCaret(ta){
  const i=+ta.dataset.index,c=chunks[i];if(!c)return;
  globalCaret=c.start+ta.selectionStart;
  globalSelEnd=c.start+ta.selectionEnd;
  updateStatus();
}
function syncFromPage(ta,focus){
  const i=+ta.dataset.index,c=chunks[i];if(!c)return;
  const localStart=ta.selectionStart,localEnd=ta.selectionEnd;
  docText=docText.slice(0,c.start)+ta.value+docText.slice(c.end);
  globalCaret=c.start+localStart;
  globalSelEnd=c.start+localEnd;
  save();
  renderPages(globalCaret,globalSelEnd,focus,true);
}
function renderPages(caret=globalCaret,selEnd=globalSelEnd,focus=false,scroll=false){
  rendering=true;
  chunks=paginate(docText);
  const container=$('pages');

  while(container.children.length>chunks.length)container.lastElementChild.remove();

  chunks.forEach((c,i)=>{
    let page=container.children[i];
    if(!page){
      page=document.createElement('div');
      const ta=document.createElement('textarea');
      ta.className='page-editor';ta.spellcheck=false;
      page.appendChild(ta);container.appendChild(page);
      bindEditor(ta);
    }
    page.className=pageClass();page.dataset.page=`${i+1}`;
    const ta=page.firstElementChild;
    ta.dataset.index=i;
    if(ta.value!==c.text){ta.value=c.text;ta.scrollTop=0;ta.scrollLeft=0;}
  });

  globalCaret=Math.max(0,Math.min(caret,docText.length));
  globalSelEnd=Math.max(globalCaret,Math.min(selEnd,docText.length));
  updateStatus();

  if(focus){
    const p=pageForOffset(globalCaret);
    const c=chunks[p],ta=container.children[p].firstElementChild;
    const start=Math.min(globalCaret-c.start,ta.value.length);
    const end=Math.min(globalSelEnd-c.start,ta.value.length);
    if(document.activeElement!==ta)ta.focus({preventScroll:true});
    // Preserve native selection on ordinary keystrokes. No delayed caret reset.
    if(ta.selectionStart!==start||ta.selectionEnd!==end)ta.setSelectionRange(start,end);
    ta.scrollTop=0;ta.scrollLeft=0;
    if(scroll)scheduleReveal();
  }
  rendering=false;
}

function setDoc(text,caret=0,end=caret,rememberIt=true,focus=true){
  if(rememberIt)remember();
  docText=String(text??'').replace(/\r\n?/g,'\n');
  globalCaret=Math.max(0,Math.min(caret,docText.length));
  globalSelEnd=Math.max(globalCaret,Math.min(end,docText.length));
  save();renderPages(globalCaret,globalSelEnd,focus,true);
}

$('undoBtn').onclick=()=>{
  if(!history.length)return;
  docText=history.pop();
  globalCaret=globalSelEnd=Math.min(globalCaret,docText.length);
  save();renderPages(globalCaret,globalSelEnd,true,true);
  $('undoBtn').disabled=!history.length;
};
$('newBtn').onclick=()=>{if(confirm('現在の本文を消しますか？'))setDoc('',0,0,true,true)};
$('openBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=async e=>{
  const f=e.target.files?.[0];if(!f)return;
  setDoc(await f.text(),0,0,true,true);e.target.value='';
};
$('saveBtn').onclick=()=>{
  const blob=new Blob([docText],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='kotoba-'+new Date().toISOString().slice(0,10)+'.txt';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$('pdfBtn').onclick=()=>{$('printArea').textContent=docText;window.print()};

function formatText(){
  let t=docText.replace(/\r\n?/g,'\n');
  t=t.split('\n').map(line=>line.replace(/[ \t]+$/g,'')).join('\n');
  t=t.replace(/\n{4,}/g,'\n\n\n');
  if($('indent').checked){
    t=t.split('\n').map(line=>{
      if(!line.trim())return '';
      if(/^[　「『（【〈《〔［｛]/.test(line))return line;
      return '　'+line.replace(/^[ 　]+/,'');
    }).join('\n');
  }
  setDoc(t,Math.min(globalCaret,t.length),Math.min(globalSelEnd,t.length),true,true);
}
$('formatBtn').onclick=formatText;

/* 検索・置換 */
$('findBtn').onclick=()=>{$('findPanel').classList.add('show');$('findText').focus()};
$('closeFind').onclick=()=>$('findPanel').classList.remove('show');
function matches(q){
  const a=[];if(!q)return a;let p=0;
  while(p<=docText.length-q.length){const i=docText.indexOf(q,p);if(i<0)break;a.push(i);p=i+Math.max(1,q.length)}
  return a;
}
function showMatch(start,q,idx,total){
  if(start<0){$('findInfo').textContent='0件';$('searchPreview').textContent='見つかりません';currentMatch=null;$('goMatchBtn').disabled=true;return}
  const a=Math.max(0,start-35),b=Math.min(docText.length,start+q.length+35);
  $('searchPreview').textContent=(a?'…':'')+docText.slice(a,b)+(b<docText.length?'…':'');
  $('findInfo').textContent=`${idx+1} / ${total}件`;
  currentMatch={start,end:start+q.length};$('goMatchBtn').disabled=false;
}
function findNext(){
  const q=$('findText').value;if(!q)return false;
  const m=matches(q);if(!m.length){showMatch(-1,q,0,0);return false}
  if(q!==lastSearchQuery){lastSearchQuery=q;searchPos=0}
  let idx=m.findIndex(x=>x>=searchPos);if(idx<0)idx=0;
  const s=m[idx];searchPos=s+q.length;showMatch(s,q,idx,m.length);return true;
}
$('nextBtn').onclick=findNext;
$('findText').oninput=()=>{lastSearchQuery='';searchPos=0;currentMatch=null;$('goMatchBtn').disabled=true};
$('goMatchBtn').onclick=()=>{
  if(!currentMatch)return;
  $('findPanel').classList.remove('show');
  globalCaret=currentMatch.start;globalSelEnd=currentMatch.end;
  renderPages(globalCaret,globalSelEnd,true,true);
};
$('replaceOneBtn').onclick=()=>{
  const q=$('findText').value,r=$('replaceText').value;if(!q)return;
  if(!currentMatch||docText.slice(currentMatch.start,currentMatch.end)!==q){lastSearchQuery='';searchPos=0;if(!findNext())return}
  const m=currentMatch,next=docText.slice(0,m.start)+r+docText.slice(m.end);
  setDoc(next,m.start,m.start+r.length,true,false);
  searchPos=m.start+r.length;currentMatch=null;lastSearchQuery=q;findNext();
};
$('replaceAllBtn').onclick=()=>{
  const q=$('findText').value,r=$('replaceText').value;if(!q)return;
  const n=matches(q).length;if(!n){showMatch(-1,q,0,0);return}
  setDoc(docText.split(q).join(r),0,0,true,false);
  $('findInfo').textContent=n+'件置換しました';$('searchPreview').textContent=n+'件を置換しました';
  currentMatch=null;searchPos=0;lastSearchQuery='';$('goMatchBtn').disabled=true;
};

/* AI軽推敲 */
$('aiBtn').onclick=()=>$('aiPanel').classList.add('show');
$('closeAI').onclick=()=>$('aiPanel').classList.remove('show');
function aiTarget(){
  const LIMIT=800,s=globalCaret,e=globalSelEnd;
  if(e>s){
    if(e-s>LIMIT)return {error:`一度に${LIMIT}字以内で選択してください。`};
    return {start:s,end:e,text:docText.slice(s,e)};
  }
  const before=docText.slice(0,s),after=docText.slice(s);
  const ps=Math.max(0,before.lastIndexOf('\n')+1);
  let rel=after.indexOf('\n');if(rel<0)rel=after.length;
  const pe=s+rel;
  if(pe-ps<=LIMIT)return {start:ps,end:pe,text:docText.slice(ps,pe)};
  let st=Math.max(ps,s-400),en=Math.min(pe,st+LIMIT);st=Math.max(ps,en-LIMIT);
  return {start:st,end:en,text:docText.slice(st,en)};
}
$('prepareAI').onclick=async()=>{
  $('prepareAI').disabled=true;$('aiStatus').textContent=privacyMode?'保存済みAIを読み込み中…':'AIを準備中…';
  try{
    webllm ||= await import(CDN);
    const appConfig={...webllm.prebuiltAppConfig,cacheBackend:'cache'};
    aiEngine=await webllm.CreateMLCEngine(MODEL,{appConfig,initProgressCallback:p=>$('aiStatus').textContent=p.text||'AIを準備中…'});
    $('aiStatus').textContent=privacyMode?'AI軽推敲 使用可能（秘匿モード）':'AI軽推敲 使用可能';
    $('runAI').disabled=false;$('prepareAI').textContent='AI準備済み';
    localStorage.setItem('kotoba-writer-ai-ready','1');
  }catch(e){
    $('aiStatus').textContent=privacyMode?'保存済みAIが不足しています。一度秘匿モードをOFFにして準備してください。':'AI準備エラー: '+((e&&e.message)||String(e));
    $('prepareAI').disabled=false;
  }
};
$('runAI').onclick=async()=>{
  if(!aiEngine)return;
  const r=aiTarget();if(r.error){$('aiStatus').textContent=r.error;return}
  if(!r.text.trim()){$('aiStatus').textContent='推敲する文章がありません';return}
  aiRange=r;aiSnapshot=docText;$('runAI').disabled=true;$('applyAI').disabled=true;$('aiResult').textContent='軽推敲中…';
  const messages=[
    {role:'system',content:'あなたは日本語小説の校正担当です。原文の事実、設定、人物、出来事、感情、会話内容、時系列を追加・変更しないでください。新しい描写、比喩、説明、台詞、情報を足してはいけません。助詞・句読点・語順・重複表現・不自然な語尾・明らかな文法ミスだけを最小限直してください。直す必要がなければ原文をそのまま返してください。出力は修正文だけ。'},
    {role:'user',content:'次の文章を意味を変えず最小限だけ整えてください。\n\n---\n'+r.text+'\n---'}
  ];
  try{
    const res=await aiEngine.chat.completions.create({messages,temperature:0.1,top_p:0.8,max_tokens:220});
    $('aiResult').textContent=(res.choices?.[0]?.message?.content||r.text).trim();
    $('applyAI').disabled=false;$('aiStatus').textContent='候補を確認してください';
  }catch(e){$('aiResult').textContent='生成エラー: '+((e&&e.message)||String(e));$('aiStatus').textContent='AI軽推敲に失敗しました'}
  finally{$('runAI').disabled=false}
};
$('applyAI').onclick=()=>{
  if(!aiRange)return;
  const out=$('aiResult').textContent;if(!out||out.startsWith('生成エラー'))return;
  if(docText!==aiSnapshot){$('aiStatus').textContent='生成後に本文が変わったため反映を中止しました';$('applyAI').disabled=true;return}
  const next=docText.slice(0,aiRange.start)+out+docText.slice(aiRange.end);
  setDoc(next,aiRange.start,aiRange.start+out.length,true,true);
  $('applyAI').disabled=true;$('aiStatus').textContent='本文へ反映しました';aiRange=null;aiSnapshot=null;
};

/* 秘匿モード */
function syncPrivacy(){
  $('privacyBtn').textContent=privacyMode?'秘匿モード ON':'秘匿モード OFF';
  $('privacyBtn').classList.toggle('on',privacyMode);
  $('privacyBanner').classList.toggle('show',privacyMode);
}
async function tellSW(enabled){
  if(!('serviceWorker'in navigator))return;
  const reg=await navigator.serviceWorker.ready,target=navigator.serviceWorker.controller||reg.active;
  if(target)target.postMessage({type:'SET_OFFLINE_ONLY',enabled});
}
$('privacyBtn').onclick=async()=>{
  if(!privacyMode){
    if(localStorage.getItem('kotoba-writer-ai-ready')!=='1'&&!confirm('AI準備前です。それでも秘匿モードをONにしますか？'))return;
    privacyMode=true;
  }else{
    if(!confirm('秘匿モードをOFFにしますか？'))return;
    privacyMode=false;
  }
  localStorage.setItem('kotoba-writer-privacy',privacyMode?'1':'0');syncPrivacy();
  try{await tellSW(privacyMode)}catch{}
};

['fontSize','lineHeight','writingMode','manuscript','indent','charCount','lineCount'].forEach(id=>$(id).addEventListener('change',applySettings));
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{
  const [c,l]=b.dataset.preset.split(',');$('charCount').value=c;$('lineCount').value=l;applySettings();
});
window.addEventListener('pagehide',()=>{if(!isComposing)save()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&!isComposing)save()});

viewportChanged();
loadSettings();
applySettings();
syncPrivacy();
renderPages(0,0,false,false);

if('serviceWorker'in navigator){
  navigator.serviceWorker.register('./sw.js?v='+BUILD,{updateViaCache:'none'}).then(async r=>{
    if(!privacyMode){try{await r.update()}catch{}}
    try{await navigator.serviceWorker.ready;await tellSW(privacyMode)}catch{}
  }).catch(()=>{});
}
</script>
</body>
