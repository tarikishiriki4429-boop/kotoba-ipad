<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eceae6">
<link rel="manifest" href="./manifest.webmanifest">
<title>Kotoba Writer</title>
<style>
:root{
  --font-size:18px; --line-height:1.9; --chars:40; --lines:30;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  color:#202020;background:#d8d7d4;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8d7d4}
body{position:fixed;left:0;right:0;top:var(--viewport-top,0px);height:var(--viewport-height,100dvh);display:flex;flex-direction:column}
.topbar,.toolbar,.statusbar{flex-shrink:0}
button,select,input{font:inherit}
button{border:1px solid #c9c7c2;border-radius:9px;background:#fff;color:#222;padding:8px 11px;font-weight:600}
button.primary{background:#222;color:#fff;border-color:#222}
button:disabled{opacity:.45}
.topbar{
  position:relative;top:auto;z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:max(9px,env(safe-area-inset-top)) 10px 9px;background:rgba(246,245,242,.96);
  border-bottom:1px solid #c9c7c2;backdrop-filter:blur(10px)
}
.title{font-weight:800}.spacer{flex:1}
.toolbar{
  position:relative;top:auto;z-index:19;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:8px 10px;background:#efede9;border-bottom:1px solid #ccc9c3
}
.toolbar label{display:flex;align-items:center;gap:5px;font-size:13px;color:#555}
.toolbar select,.toolbar input[type=number]{background:white;border:1px solid #cbc8c0;border-radius:8px;padding:7px}
.toolbar input[type=number]{width:68px}
.presetbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.presetbar button{padding:6px 9px;font-size:12px}
.workspace{flex:1;min-height:0;padding:28px 10px 40px;overflow:auto;overscroll-behavior:contain;overflow-anchor:none;scroll-behavior:auto}
.pages{display:flex;flex-direction:column;gap:26px;align-items:flex-start;min-width:max-content}
.page{
  position:relative;background:#fff;box-shadow:0 2px 13px rgba(0,0,0,.16);
  padding:56px 58px;border-radius:2px;width:max-content;margin-inline:auto;flex-shrink:0;
}
.page::after{
  content:attr(data-page);position:absolute;right:16px;bottom:12px;font-size:11px;color:#999;
}
.page-editor{
  display:block;margin:0;padding:0;border:0;outline:0;resize:none;background:transparent;color:#171717;
  font-size:var(--font-size);line-height:var(--line-height);
  font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  font-kerning:none;font-variant-east-asian:full-width;
  letter-spacing:0;caret-color:#111;white-space:pre-wrap;overflow:visible;
  line-break:auto;word-break:normal;box-sizing:content-box;
  -webkit-user-select:text;user-select:text;cursor:text;
  width:calc(var(--chars) * 1em);
  height:calc(var(--lines) * var(--font-size) * var(--line-height));
}
.page.vertical .page-editor{
  -webkit-user-select:text;user-select:text;cursor:text;
  writing-mode:vertical-rl;text-orientation:mixed;
  width:calc(var(--lines) * var(--font-size) * var(--line-height));
  height:calc(var(--chars) * 1em);
}
.editor-line{
  display:block;inline-size:calc(var(--chars) * 1em);
  block-size:calc(var(--font-size) * var(--line-height));
  white-space:pre;overflow:visible;
}
.editor-char{
  display:inline-block;inline-size:1em;text-align:center;
  white-space:pre;vertical-align:baseline;
}
/* Preedit appears AT its actual vertical cells instead of at the hidden
   native input position. Text is provisional until the IME commits it. */
.page.vertical .editor-char.ime-preedit{
  box-shadow:inset -2px 0 0 #2676d4;background:rgba(38,118,212,.065);
}
.editor-line > br{display:none}
.hanging-char{position:relative;z-index:2;overflow:visible}
.hanging-char::selection{background:Highlight;color:HighlightText}
/* Build34: Keep IME composition inside a real native textarea.  A
   contenteditable containing one-cell spans makes WebKit introduce transient
   DIV/BR nodes and moves the preedit line.  It must never own our manuscript. */
.page{isolation:isolate}
.page-editor{
  position:relative;z-index:2;appearance:none;-webkit-appearance:none;
  display:block;border:0!important;outline:0!important;box-shadow:none!important;
  margin:0!important;padding:0!important;text-indent:0!important;
  border-radius:0!important;background:transparent!important;
  overflow:hidden;overflow-wrap:anywhere;word-break:break-all;
  white-space:pre-wrap;resize:none;tab-size:1;
  opacity:0;caret-color:#111;
}
/* Pasting across a page boundary must not trap touch scrolling in a nested textarea. */
.page.editing .page-editor{opacity:1;overflow:hidden}
.page-preview{position:absolute;z-index:1;pointer-events:none;left:58px;top:56px;
  margin:0;padding:0;border:0;overflow:visible;
  font-size:var(--font-size);line-height:var(--line-height);
  font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  font-kerning:none;font-variant-east-asian:full-width;
  width:calc(var(--chars) * 1em);
  height:calc(var(--lines) * var(--font-size) * var(--line-height));
}
.page.vertical .page-preview{
  writing-mode:vertical-rl;text-orientation:mixed;
  width:calc(var(--lines) * var(--font-size) * var(--line-height));
  height:calc(var(--chars) * 1em);
}
.page.editing .page-preview{visibility:hidden}
@media(max-width:700px){.page-preview{left:24px;top:38px}}
/* build47: The native textarea continues to own text and IME, but WebKit's
   vertical wrapping cannot be used as our manuscript layout. Draw the visible
   glyphs and caret on the exact same grapheme grid, even while composing. */
/* build48: iPad needs its REAL IME input caret at the visible vertical
   writing position. A full-page horizontal textarea pinned to the top left
   makes the Japanese conversion bar appear on the wrong side of the paper.
   Instead the vertical textarea is a compact native composition proxy,
   positioned at the grid caret. The canonical manuscript stays in docText. */
.page.vertical .page-editor,
.page.vertical.editing .page-editor{
  position:absolute!important;z-index:3!important;
  width:calc(var(--font-size) * 1.4)!important;
  height:calc(var(--font-size) * 10)!important;
  min-width:0!important;max-width:none!important;
  min-height:0!important;
  overflow:hidden!important;
  writing-mode:vertical-rl!important;text-orientation:mixed!important;
  color:transparent!important;-webkit-text-fill-color:transparent!important;
  background:transparent!important;caret-color:transparent!important;
  pointer-events:none!important;opacity:1!important;
  font-size:var(--font-size)!important;line-height:1!important;
  box-sizing:border-box!important;
  white-space:pre!important;overflow-wrap:normal!important;word-break:normal!important;
}
.page.manuscript.vertical .page-preview{
  background-image:
    linear-gradient(to right,rgba(0,0,0,.065) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(0,0,0,.065) 1px,transparent 1px);
  background-size:calc(var(--font-size) * var(--line-height)) 1em;
}
.page.manuscript.vertical .page-editor{background-image:none!important}
.page.vertical{cursor:text;box-sizing:border-box;
  width:calc(var(--lines) * var(--font-size) * var(--line-height) + 116px);
  height:calc(var(--chars) * var(--font-size) + 112px);
}
@media(max-width:700px){.page.vertical{
  width:calc(var(--lines) * var(--font-size) * var(--line-height) + 48px);
  height:calc(var(--chars) * var(--font-size) + 76px);
}}
.page.vertical.editing .page-preview{visibility:visible!important}
.page.vertical.editing .page-preview{visibility:visible!important}
.page .grid-caret{
  position:absolute;display:none;pointer-events:none;z-index:6;
  width:var(--font-size);height:2px;background:#183d72;border-radius:2px;
  box-shadow:0 0 0 .2px #183d72;
}
.page.vertical.editing .grid-caret{display:block}
.page.vertical.editing .grid-caret.selected{display:none}
@media (prefers-reduced-motion: no-preference){
  .page.vertical.editing .grid-caret{animation:kw-caret-blink 1.1s steps(2,start) infinite}
}
@keyframes kw-caret-blink{to{opacity:0}}
.page.manuscript:not(.vertical) .page-editor{
  background-image:
    linear-gradient(to right,rgba(0,0,0,.065) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(0,0,0,.065) 1px,transparent 1px);
  background-size:1em calc(var(--font-size) * var(--line-height));
}
.page.manuscript.vertical .page-editor{
  background-image:
    linear-gradient(to right,rgba(0,0,0,.065) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(0,0,0,.065) 1px,transparent 1px);
  background-size:calc(var(--font-size) * var(--line-height)) 1em;
}
.statusbar{
  position:relative;left:auto;right:auto;bottom:auto;z-index:30;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  padding:8px 12px max(8px,env(safe-area-inset-bottom));background:rgba(246,245,242,.96);
  border-top:1px solid #c9c7c2;font-size:12px;color:#555;backdrop-filter:blur(10px)
}
.build{margin-left:auto;font-weight:700}
.panel{
  position:fixed;inset:auto 12px calc(52px + env(safe-area-inset-bottom)) 12px;z-index:40;
  background:#fff;border:1px solid #ccc;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);
  padding:14px;display:none;max-width:760px;margin:auto
}
.panel.show{display:block}
#fullTextPanel{top:max(12px,env(safe-area-inset-top));bottom:max(12px,env(safe-area-inset-bottom));max-width:980px}
#fullTextPanel.show{display:flex;flex-direction:column}
#fullText{flex:1;min-height:0;width:100%;resize:none;font-size:18px;line-height:1.8;padding:12px;border:1px solid #bbb;border-radius:8px;white-space:pre-wrap;-webkit-user-select:text;user-select:text}.panel h3{margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row input[type=text]{flex:1;min-width:150px;border:1px solid #bbb;border-radius:9px;padding:9px}
.note{font-size:12px;color:#666;line-height:1.5;margin-top:8px}
.result{margin-top:10px;padding:12px;border-radius:10px;background:#f3f1ed;white-space:pre-wrap;max-height:30vh;overflow:auto}
.privacy-btn.on{background:#153d24;color:#fff;border-color:#153d24}
.privacy-banner{
  display:none;max-width:980px;margin:10px auto 0;padding:9px 12px;background:#e8f3eb;border:1px solid #b9d7c1;
  border-radius:10px;font-size:12px;color:#21482c
}
.privacy-banner.show{display:block}
#fileInput,#printArea{display:none}
@media(max-width:700px){
  .toolbar{top:auto}.workspace{padding-top:16px}.page{padding:38px 24px}.pages{align-items:flex-start}
}
/* Print one physical A4 sheet for each manuscript page. Pagination is shared with
   the editor rather than delegated to the browser's flowing-text layout. */
/* iPad Safari may reserve additional room for print headers, footers and
   page margins. A 252mm print sheet may fragment on the very last page.
   Keep each sheet safely below A4's 261mm nominal printable height, and
   keep the actual manuscript grid smaller than the sheet itself. Force
   break BEFORE each subsequent sheet (not after the last), to prevent both
   2-up printing and a dangling extra last page. */
@media print{
  @page{size:A4 portrait;margin:18mm}
  html,body{display:block!important;position:static!important;inset:auto!important;
    width:auto!important;height:auto!important;min-height:0!important;
    overflow:visible!important;background:white!important;margin:0!important;padding:0!important}
  .topbar,.toolbar,.statusbar,.panel,.privacy-banner,.workspace{display:none!important}
  #printArea{display:block!important;position:static!important;width:170mm!important;
    margin:0!important;padding:0!important;background:white!important}
  #printArea .print-sheet{position:relative;display:block;box-sizing:border-box;
    width:170mm;height:220mm;margin:0;padding:0;background:white;color:#171717;
    overflow:hidden;break-inside:avoid;page-break-inside:avoid}
  /* One manuscript page per PHYSICAL sheet. Without a forced new sheet here,
     iPad Safari scales landscape content and packs two short sheets on a page. */
  #printArea .print-sheet + .print-sheet{
    break-before:page!important;page-break-before:always!important;
  }
  /* Vertical text uses a landscape A4 page and a landscape manuscript grid.
     Safari may ignore CSS @page orientation; its native dialog must then be
     set to Landscape by the user. A shorter fixed sheet avoids blank tail pages. */
  #printArea.vertical-print{width:260mm!important}
  #printArea.vertical-print .print-sheet{width:260mm;height:160mm}
  #printArea.vertical-print .print-preview.vertical{
    position:relative;margin-left:auto;margin-right:0;
    writing-mode:vertical-rl;text-orientation:mixed}
  #printArea.vertical-print .print-page-number{right:3mm;bottom:2mm}
  #printArea .print-preview{display:block;position:relative;overflow:visible;margin:0;padding:0;border:0;
    width:calc(var(--chars) * var(--print-font-size));
    height:calc(var(--lines) * var(--print-font-size) * var(--line-height));
    font-size:var(--print-font-size);line-height:var(--line-height);
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    font-kerning:none;font-variant-east-asian:full-width;letter-spacing:0;white-space:pre-wrap}
  #printArea .print-preview.vertical{writing-mode:vertical-rl;text-orientation:mixed;
    width:calc(var(--lines) * var(--print-font-size) * var(--line-height));
    height:calc(var(--chars) * var(--print-font-size))}
  #printArea .print-preview .editor-line{block-size:calc(var(--print-font-size) * var(--line-height));
    inline-size:calc(var(--chars) * var(--print-font-size))}
  #printArea .print-page-number{position:absolute;right:2mm;bottom:1mm;
    font-family:system-ui,sans-serif;font-size:8pt;line-height:1;color:#777}
}

/* Search results can be inspected without closing the replace controls. */
#findPanel{max-width:900px;max-height:calc(100dvh - 24px);overflow-y:auto}
#searchPreview{max-height:12vh;overflow-y:auto}
#searchResults{display:flex;flex-direction:column;gap:5px;max-height:30vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;margin-top:7px;padding:3px;border:1px solid #dedbd5;
  border-radius:9px;background:#f9f8f6}
.search-hit{display:block;width:100%;background:white;color:#222;text-align:left;
  border:1px solid #dedbd5;padding:8px 10px;border-radius:8px;font-weight:400;
  white-space:normal;overflow-wrap:anywhere}
.search-hit.active{background:#edf3ff;border:2px solid #3271c5;padding:7px 9px}
.search-hit .search-meta{display:block;font-size:12px;font-weight:700;color:#444;margin-bottom:4px}
.search-hit .search-context{font-size:13px;line-height:1.5;white-space:pre-wrap}
.search-hit mark{background:#ffe69c;padding:0 1px;border-radius:2px;color:inherit}
#searchMore{margin-top:7px;width:100%;display:none}
.page.search-page{outline:2px solid #4678c0;outline-offset:2px}
.page-preview .editor-char.search-target{background:#ffe69c;box-shadow:0 0 0 1px #d3aa4a;border-radius:2px}


/* 利用条件はiframeではなくアプリ内へ表示する。Safariの空白iframeを回避。 */
#licensesPanel{max-width:960px}
#licensesHeader{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
#licensesDirectLink{font-size:13px;color:#075caa;text-decoration:underline}
#licensesStatus{font-size:13px;color:#555;line-height:1.5;margin:8px 0;min-height:1em}
#licensesContent{height:65vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 22px;background:#faf9f6;border-radius:4px;color:#222;
  font-family:system-ui,sans-serif;font-size:16px;line-height:1.7;overflow-wrap:anywhere}
#licensesContent pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
#licensesContent summary{cursor:pointer;padding:12px;background:#eee}
#licensesContent details{margin:10px 0}
#licensesContent a{color:#075caa;text-decoration:underline}

</style>
</head>
<body>

<div class="topbar">
  <div class="title">Kotoba Writer</div>
  <span class="note" aria-label="AI非搭載版">執筆版・AI非搭載</span>
  <button id="newBtn">新規</button>
  <button id="undoBtn" disabled>取り消し</button>
  <button id="openBtn">TXTを開く</button>
  <button id="saveBtn">TXT保存</button>
  <button id="fileNameBtn">名前変更</button>
  <button id="pdfBtn">PDF / 印刷</button>
  <div class="spacer"></div>
  <button id="findBtn">検索・置換</button>
  <button id="formatBtn">体裁を整える</button>
  <button id="trimLeadingBtn" title="原稿先頭に残った空行だけを確認のうえ削除します">先頭空行を削除</button>
  <button id="selectAllBtn">全文を選択</button>
  
  <button id="licensesBtn">利用条件・ライセンス</button>
  <button id="checkAppUpdate" title="必要なときだけ更新確認を行います。通信が発生します">更新確認</button>
  <button id="privacyBtn" class="privacy-btn">秘匿モード OFF</button>
</div>

<div class="toolbar">
  <label>文字サイズ
    <select id="fontSize">
      <option>14</option><option>16</option><option selected>18</option><option>20</option><option>22</option><option>24</option><option>28</option>
    </select>
  </label>
  <label>行間
    <select id="lineHeight">
      <option value="1.5">狭い</option><option value="1.7">やや狭い</option><option value="1.9" selected>標準</option><option value="2.1">広い</option><option value="2.3">かなり広い</option>
    </select>
  </label>
  <label>表示
    <select id="writingMode"><option value="horizontal">横書き</option><option value="vertical">縦書き</option></select>
  </label>
  <label><span id="charsLabel">1行の文字数</span><input id="charCount" type="number" min="10" max="60" value="40"></label>
  <label><span id="linesLabel">行数</span><input id="lineCount" type="number" min="10" max="50" value="30"></label>
  <label><input id="manuscript" type="checkbox"> マス目</label>
  <label><input id="indent" type="checkbox" checked> 段落頭を一字下げ</label>
  
  <div class="presetbar">
    <span style="font-size:12px;color:#666">プリセット</span>
    <button data-preset="40,30">40×30</button>
    <button data-preset="42,34">42×34</button>
    <button data-preset="20,20">20×20</button>
  </div>
</div>

<div id="privacyBanner" class="privacy-banner">秘匿モードON：ネット取得をキャッシュ限定にしています。</div>
<div class="workspace"><div id="pages" class="pages"></div></div>

<div class="statusbar">
  <span id="saveStatus">自動保存</span>
  <span id="count">0文字</span>
  <span id="cursor">1ページ 1行 1列</span>
  <span id="pageInfo">40字 × 30行</span>
  <span id="pageCount">1ページ</span>
  <span id="textIntegrity" title="入力した本文に含まれる明示改行と半角スペースの数（テスト版の診断表示）">改行0 / 半角空白0</span>
  <span id="documentName"></span>
  <span class="build" id="buildVersion">Kotoba Writer build 37</span>
</div>

<div id="fileNamePanel" class="panel">
  <h3>保存するファイル名</h3>
  <div class="row">
    <input id="fileName" type="text" aria-label="保存するファイル名" autocomplete="off" spellcheck="false">
    <button id="applyFileName">名前を変更</button><button id="closeFileName">閉じる</button>
  </div>
  <div class="note" id="fileSaveInfo"></div>
  <div class="note">名前の変更は次のTXT保存に使います。元ファイルの名前は、この操作だけでは変わりません。</div>
</div>

<div id="findPanel" class="panel">
  <h3>検索・置換</h3>
  <div class="row">
    <input id="findText" type="text" placeholder="検索する文字">
    <button id="prevBtn" type="button">前へ</button><button id="nextBtn" type="button">次へ</button><span id="findInfo" class="note"></span>
  </div>
  <div class="row" style="margin-top:8px">
    <input id="replaceText" type="text" placeholder="置換後の文字">
    <button id="replaceOneBtn" disabled>選択した1件を置換</button>
    <button id="replaceAllBtn">すべて置換</button>
    <button id="goMatchBtn" disabled>本文で確認</button>
    <button id="closeFind">閉じる</button>
  </div>
  <div id="searchPreview" class="result">一覧から選ぶと、その場所へ移動します。</div>
  <div id="searchResultsSummary" class="note" role="status">検索語を入力してください。</div>
  <div id="searchResults" role="group" aria-label="検索結果一覧"></div>
  <button id="searchMore" type="button">さらに100件表示</button>
</div>

<div id="fullTextPanel" class="panel" role="dialog" aria-label="全文選択">
  <h3>全文選択</h3>
  <div class="row">
    <button id="reselectAll">すべて選択</button>
    <button id="copyFullText">コピー</button>
    <button id="cutFullText">切り取り</button>
    <button id="pasteFullText">貼り付け</button>
    <button id="deleteFullText">選択範囲を削除</button>
    <button id="undoFullText">取り消し</button>
    
    <button id="closeFullText">閉じる</button>
  </div>
  <p class="note">全ページをまとめて編集できます。変更は本文に反映・端末内に保存されます。</p>
  <p id="fullTextStatus" class="note" role="status"></p>
  <textarea id="fullText" aria-label="全文（編集・選択・コピー用）"></textarea>
</div>
<div id="licensesPanel" class="panel" role="dialog" aria-label="利用条件・ライセンス">
  <div id="licensesHeader"><button id="closeLicenses">閉じる</button><a id="licensesDirectLink" href="./licenses.html?view=build48" target="_blank" rel="noopener noreferrer">利用条件を別タブで開く</a></div>
  <div id="licensesStatus" role="status" aria-live="polite"></div>
  <div id="licensesContent" role="document" aria-label="利用条件の本文" tabindex="0"></div>
</div>
<input id="fileInput" type="file" accept=".txt,text/plain">
<div id="printArea"></div>

<script type="module">
const BUILD=48;
const $=id=>document.getElementById(id);
$('buildVersion').textContent='Kotoba Writer build '+BUILD;

const FILE_NAME_KEY='kotoba-writer-file-name-v1';
const defaultFileName=()=> 'kotoba-'+new Date().toISOString().slice(0,10)+'.txt';
let documentFileName=localStorage.getItem(FILE_NAME_KEY)||defaultFileName();
let documentFileHandle=null,fileOperationBusy=false;

let chunks=[];
let globalCaret=0, globalSelEnd=0;
let history=[];
let isComposing=false;
const graphemes=new Intl.Segmenter('ja',{granularity:'grapheme'});
function units(text){return Array.from(graphemes.segment(text));}
function previousOffset(pos){const a=units(docText.slice(0,pos));return a.length?a[a.length-1].index:0;}
function nextOffset(pos){const a=units(docText.slice(pos));return pos+(a[0]?.segment.length||0);}
let rendering=false;
// iPad Safari may drop auto-repeat keystrokes if every native insertion
// immediately rebuilds the contenteditable cells and replaces the caret.
// Keep the browser's live editing DOM while characters arrive, and normalize
// layout only after the burst of input stops. This timer never owns the text;
// docText/localStorage are synchronized on every non-composing input.
const LAYOUT_IDLE_MS=260;
let layoutIdleTimer=0;
function scheduleIdleLayout(ta){
  clearTimeout(layoutIdleTimer);
  layoutIdleTimer=setTimeout(()=>{
    layoutIdleTimer=0;
    if(isComposing || !ta.isConnected || ta._selecting)return;
    const focused=document.activeElement===ta;
    if(focused){
      // Read native selection now, never restore the pre-long-press caret.
      syncCaret(ta);
      if(ta.selectionStart!==ta.selectionEnd)return;
      const next=paginate(docText);
      // Ordinary typing does not need any input value assignment or layout.
      if(next.length===chunks.length && next.every((c,i)=>c.start===chunks[i].start && c.end===chunks[i].end))return;
    }
    renderPages(globalCaret,globalSelEnd,focused,true);
  },LAYOUT_IDLE_MS);
}
function scheduleCompositionPreview(ta){
  if(ta._previewFrame)return;
  ta._previewFrame=requestAnimationFrame(()=>{
    ta._previewFrame=0;
    if(isComposing && ta.isConnected)paintVertical(ta);
  });
}
let revealFrame=0;
let inputScroll=null,restoreFrame=0,compositionScroll=null;
function captureInputScroll(){
  const w=document.querySelector('.workspace');
  inputScroll=compositionScroll || {left:w.scrollLeft,top:w.scrollTop};
}
function restoreInputScroll(){
  if(!inputScroll)return;
  const position=inputScroll;inputScroll=null;
  const w=document.querySelector('.workspace');
  w.scrollLeft=position.left;w.scrollTop=position.top;
  cancelAnimationFrame(restoreFrame);
  restoreFrame=requestAnimationFrame(()=>{
    w.scrollLeft=position.left;w.scrollTop=position.top;
    if(!isComposing)scheduleReveal();
  });
}
// A real touch/wheel gesture always takes precedence over automatic restoration.
for(const type of ['touchstart','pointerdown','wheel'])document.addEventListener(type,()=>{
  inputScroll=null;compositionScroll=null;cancelAnimationFrame(restoreFrame);cancelAnimationFrame(revealFrame);
},{passive:true});
function viewportChanged(){
  const vv=window.visualViewport;
  document.documentElement.style.setProperty('--viewport-height',(vv?.height||innerHeight)+'px');
  document.documentElement.style.setProperty('--viewport-top',(vv?.offsetTop||0)+'px');
}
function viewportResized(){viewportChanged();if(compositionScroll){inputScroll=compositionScroll;restoreInputScroll()}else scheduleReveal();}
window.visualViewport?.addEventListener('resize',viewportResized);
// Panning the visual viewport must not start another editor scroll.
window.visualViewport?.addEventListener('scroll',viewportChanged);
window.addEventListener('resize',viewportResized);
// Scroll only enough to expose the actual caret, never center the entire sheet.
function scheduleReveal(){
  cancelAnimationFrame(revealFrame);
  revealFrame=requestAnimationFrame(()=>{
    const ta=document.activeElement;
    if(isComposing || !ta?.classList.contains('page-editor'))return;
    const workspace=document.querySelector('.workspace');
    // Native collapsed ranges can have no rect (especially during WebKit
    // layout). Never substitute the entire editor/line's bounding box: its
    // bottom would scroll the viewport to the end of the manuscript.
    const m=editorCaretRect(ta);
    if(!m)return;
    const style=getComputedStyle(ta),view=workspace.getBoundingClientRect();
    const left=m.left,top=m.top;
    const right=left+Math.max(2,m.width),bottom=top+Math.max(parseFloat(style.fontSize),m.height);
    const dx=left<view.left+12?left-view.left-12:right>view.right-12?right-view.right+12:0;
    const dy=top<view.top+12?top-view.top-12:bottom>view.bottom-12?bottom-view.bottom+12:0;
    if(dx||dy)workspace.scrollBy({left:dx,top:dy,behavior:'instant'});
  });
}
function editorCaretRect(ta){
  if(ta.dataset.proxy==='1'){
    const visual=ta.closest('.page')?.querySelector('.grid-caret');
    if(visual && visual.style.display!=='none')return visual.getBoundingClientRect();
  }
  const c=chunks[+ta.dataset.index];if(!c)return null;
  const pos=Math.max(0,Math.min(ta.selectionStart,ta.value.length));
  const rc=ta.getBoundingClientRect(),lc=lineCol(ta.value,pos);
  const css=getComputedStyle(ta),fs=parseFloat(css.fontSize)||18,lh=parseFloat(css.lineHeight)||fs*1.9;
  const vertical=getSettings().writingMode==='vertical';
  if(vertical)return{left:rc.right-(lc.row-1)*lh-lh,top:rc.top+(lc.col-1)*fs,width:fs,height:2};
  return {left:rc.left+(lc.col-1)*fs,top:rc.top+(lc.row-1)*lh,width:2,height:fs};
}
let searchPos=0,currentMatch=null,lastSearchQuery='';
let searchPositions=[],searchDocSnapshot='',searchQuerySnapshot='',searchSelectedIndex=-1,searchVisibleCount=0;
const SEARCH_RESULT_BATCH=100;

function clamp(n,a,b,f){n=parseInt(n,10);return Number.isNaN(n)?f:Math.max(a,Math.min(b,n))}
function getSettings(){
  return {
    fontSize:$('fontSize').value,
    lineHeight:$('lineHeight').value,
    writingMode:$('writingMode').value,
    charCount:clamp($('charCount').value,10,60,40),
    lineCount:clamp($('lineCount').value,10,50,30),
    manuscript:$('manuscript').checked,
    indent:$('indent').checked

}
function saveSettings(){localStorage.setItem(SETTINGS,JSON.stringify(getSettings()))}
function loadSettings(){
  try{
    const s=JSON.parse(localStorage.getItem(SETTINGS)||'{}');
    if(s.fontSize)$('fontSize').value=s.fontSize;
    if(s.lineHeight)$('lineHeight').value=s.lineHeight;
    if(s.writingMode)$('writingMode').value=s.writingMode;
    if(s.charCount)$('charCount').value=s.charCount;
    if(s.lineCount)$('lineCount').value=s.lineCount;
    $('manuscript').checked=!!s.manuscript;
    $('indent').checked=s.indent!==false;
  }catch{}
}
function save(){
  try{localStorage.setItem(STORAGE,docText);$('saveStatus').textContent='端末内に保存済み'}
  catch{$('saveStatus').textContent='保存エラー'}
}
function remember(){
  if(history.length && history[history.length-1]===docText)return;
  history.push(docText); if(history.length>20)history.shift();
  $('undoBtn').disabled=!history.length;
}
function applySettings(){
  // Composing text should be committed by the native IME before rebuilding
  // page DOM. Moving layout controls while composition is active must not
  // destroy its provisional text or create phantom paragraphs.
  if(isComposing){
    const active=document.activeElement;
    if(active?.classList?.contains('page-editor')){
      active.blur();
      if(isComposing){
        // Apply on compositionend once Safari has finished committing.
        active.addEventListener('compositionend',()=>setTimeout(applySettings,0),{once:true});
        return;
      }
    }
  }
  const s=getSettings();
  $('charCount').value=s.charCount;$('lineCount').value=s.lineCount;
  document.documentElement.style.setProperty('--font-size',s.fontSize+'px');
  document.documentElement.style.setProperty('--line-height',s.lineHeight);
  document.documentElement.style.setProperty('--chars',s.charCount);
  document.documentElement.style.setProperty('--lines',s.lineCount);
  const v=s.writingMode==='vertical';
  $('charsLabel').textContent=v?'1列の文字数':'1行の文字数';
  $('linesLabel').textContent=v?'列数':'行数';
  $('pageInfo').textContent=v?`${s.charCount}字 × ${s.lineCount}列`:`${s.charCount}字 × ${s.lineCount}行`;
  saveSettings();
  renderPages(globalCaret,globalSelEnd,false);
}

/* 文字数と明示改行からページを決める。
   Safariのtextarea内部スクロールにページ管理を任せない。 */
const HANGING_RE=/[、。，．！？!?：；」』）】〉》〕］｝〟’”]/u;
function isHangingChar(ch){return HANGING_RE.test(ch)}

/* 行頭に孤立させたくない句読点・閉じ括弧は、満行の直後なら
   文字数に数えず行末の余白へぶら下げる。本文文字そのものは保持する。 */
function paginate(text){
  const {charCount:cols,lineCount:rows}=getSettings();
  const out=[];
  let pageStart=0,row=0,col=0;
  const chars=units(text);
  for(let k=0;k<chars.length;k++){
    const {segment:ch,index:i}=chars[k];
    if(ch==='\n'){
      row++;col=0;
      const end=i+ch.length;
      if(row>=rows){out.push({start:pageStart,end,text:text.slice(pageStart,end)});pageStart=end;row=0;col=0;}
      continue;
    }
    if(col>=cols){
      if(isHangingChar(ch)){
        // Keep it on the completed line, outside the measure.
        continue;
      }
      row++;col=0;
      if(row>=rows){
        out.push({start:pageStart,end:i,text:text.slice(pageStart,i)});
        pageStart=i;row=0;col=0;
      }
    }
    col++;
  }
  if(pageStart<text.length || !out.length || (pageStart===text.length && text.endsWith('\n')))
    out.push({start:pageStart,end:text.length,text:text.slice(pageStart)});
  return out;
}
function pageForOffset(pos){
  pos=Math.max(0,Math.min(pos,docText.length));
  for(let i=0;i<chunks.length;i++){
    const c=chunks[i];
    if(pos>=c.start && (pos<c.end || i===chunks.length-1))return i;
  }
  return Math.max(0,chunks.length-1);
}
function lineCol(text,pos){
  const stop=gridStopForText(text,pos);
  return {row:stop.row+1,col:stop.col+1};
}
function gridStopForText(value,offset){
  const stops=gridStops(value);
  const exact=stops.filter(p=>p.offset===offset);
  return exact[exact.length-1]||stops.reduce((best,p)=>
    Math.abs(p.offset-offset)<Math.abs(best.offset-offset)?p:best,stops[0]);
}
function updateStatus(){
  $('count').textContent=docText.length+'文字';
  const p=pageForOffset(globalCaret);
  const c=chunks[p]||{start:0,text:''};
  const lc=lineCol(c.text,globalCaret-c.start);
  const vertical=getSettings().writingMode==='vertical';
  $('cursor').textContent=vertical
    ?`${p+1}ページ ${lc.row}列 ${lc.col}字`
    :`${p+1}ページ ${lc.row}行 ${lc.col}列`;
  $('pageCount').textContent=chunks.length+'ページ';
  $('textIntegrity').textContent='改行'+(docText.match(/\n/g)||[]).length+' / 半角空白'+(docText.match(/[ \u00a0]/gu)||[]).length;
}
function pageClass(){
  const s=getSettings();
  return 'page'+(s.writingMode==='vertical'?' vertical':'')+(s.manuscript?' manuscript':'');
}
// Each visual line uses the same cells as paginate(). No browser soft-wrap can
// move a hanging character away from its completed line. Only source newlines
// have BR nodes; visual wraps never add text to the saved/copyable document.
function writeEditorText(el,value,imeStart=-1,imeEnd=-1){
  const {charCount:cols}=getSettings();
  const fragment=document.createDocumentFragment();
  let col=0,row=-1,line;
  const rowLimit=getSettings().lineCount;
  function newLine(){
    row++;line=document.createElement('span');line.className='editor-line';
    fragment.append(line);col=0;
  }
  function emptyCaret(){
    if(line.childNodes.length)return;
    const end=document.createElement('span');end.setAttribute('data-caret-end','');
    end.textContent='\u200b';line.append(end);
  }
  newLine();
  for(const {segment:ch,index} of units(value)){
    if(ch==='\n'){
      emptyCaret();line.append(document.createElement('br'));
      if(row+1<rowLimit)newLine();
      continue;
    }
    const hanging=col>=cols && isHangingChar(ch);
    if(col>=cols && !hanging)newLine();
    const cell=document.createElement('span');
    cell.className='editor-char'+(hanging?' hanging-char':'')+
      (index>=imeStart && index<imeEnd?' ime-preedit':'');
    if(hanging)cell.dataset.hanging='1';
    cell.textContent=ch;line.append(cell);
    if(!hanging)col++;
  }
  emptyCaret();
  el.replaceChildren(fragment);
}
// Cursor coordinates and tap hit-testing must use the same grapheme-cell rules
// as writeEditorText() and paginate(). Offsets are UTF-16, as in textarea.
function gridStops(value){
  const {charCount:cols}=getSettings();
  let row=0,col=0;
  const stops=[{offset:0,row:0,col:0}];
  for(const {segment:ch,index} of units(value)){
    if(ch==='\n'){
      row++;col=0;
      stops.push({offset:index+ch.length,row,col});continue;
    }
    if(col>=cols && !isHangingChar(ch)){
      row++;col=0;
      // The same offset also represents the start of the new visual row.
      stops.push({offset:index,row,col});
    }
    if(col<cols)col++;
    stops.push({offset:index+ch.length,row,col});
  }
  return stops;
}
function gridOffsetAt(ta,targetRow,targetCol){
  const c=chunks[+ta.dataset.index];
  const stops=gridStops(ta.dataset.proxy==='1'?(c?.text||''):ta.value);
  let chosen=stops[0],best=Infinity;
  for(const pos of stops){
    const distance=Math.abs(pos.row-targetRow)*1000+Math.abs(pos.col-targetCol);
    if(distance<best){best=distance;chosen=pos;}
  }
  return chosen.offset;
}
function gridStopAt(ta,offset){
  const c=chunks[+ta.dataset.index];
  const stops=gridStops(ta.dataset.proxy==='1'?(c?.text||''):ta.value);
  const choices=stops.filter(p=>p.offset===offset);
  // At a visual wrap, the new column is where the next glyph is entered.
  return choices[choices.length-1]||stops.reduce((best,p)=>
    Math.abs(p.offset-offset)<Math.abs(best.offset-offset)?p:best,stops[0]);
}
function paintVertical(ta,previewOnly=false){
  const page=ta.closest('.page');
  if(!page?.classList.contains('vertical'))return;
  const preview=page.querySelector('.page-preview');
  const c=chunks[+ta.dataset.index];
  if(!preview||!c)return;
  const proxy=ta.dataset.proxy==='1';
  const localCaret=Math.max(0,Math.min(c.text.length,
    (isComposing && proxy && document.activeElement===ta
      ? (ta._compositionAnchor??globalCaret) : globalCaret)-c.start));
  let previewValue=proxy?c.text:ta.value;
  if(proxy && isComposing && document.activeElement===ta){
    previewValue=c.text.slice(0,localCaret)+ta.value+c.text.slice(localCaret);
  }
  const imeStart=proxy && isComposing && document.activeElement===ta?localCaret:-1;
  const imeEnd=imeStart<0?-1:imeStart+ta.value.length;
  const imeKey=imeStart+':'+imeEnd;
  if(preview._paintedValue!==previewValue||preview._paintedIme!==imeKey){
    writeEditorText(preview,previewValue,imeStart,imeEnd);
    preview._paintedValue=previewValue;
    preview._paintedIme=imeKey;
    preview._layoutKey='';
  }
  const caret=page.querySelector('.grid-caret');
  if(!caret || previewOnly)return;
  const selecting=!proxy && ta.selectionStart!==ta.selectionEnd ||
    proxy && globalCaret!==globalSelEnd;
  caret.classList.toggle('selected',selecting);
  if(selecting)return;
  let offset=proxy?localCaret:ta.selectionStart;
  if(proxy && isComposing && document.activeElement===ta) offset+=ta.value.length;
  // Derive coordinates from the displayed manuscript, not native WebKit wraps.
  const pos=gridStopAtText(previewValue,offset),settings=getSettings();
  const font=Number(settings.fontSize),advance=font*Number(settings.lineHeight);
  if(pos.row>=settings.lineCount){caret.style.display='none';return;}
  caret.style.display='';
  const left=preview.offsetLeft+preview.offsetWidth-(pos.row*advance+font);
  const top=preview.offsetTop+pos.col*font;
  caret.style.left=left+'px';caret.style.top=top+'px';caret.style.width=font+'px';
  // Keep the native candidate window at the START of the uncommitted text.
  // As WebKit types it vertically, the native caret advances downward here.
  if(proxy && !isComposing){
    ta.style.left=left+'px';ta.style.top=top+'px';
  }
}
function gridStopAtText(value,offset){
  const stops=gridStops(value);
  const choices=stops.filter(p=>p.offset===offset);
  return choices[choices.length-1]||stops.reduce((best,p)=>
    Math.abs(p.offset-offset)<Math.abs(best.offset-offset)?p:best,stops[0]);
}
function verticalTap(ta,e){
  if(isComposing || ta._composeFinishing || e.detail===0)return;
  const page=ta.closest('.page'),preview=page?.querySelector('.page-preview');
  const c=chunks[+ta.dataset.index];
  if(!preview||!c)return;
  const rect=preview.getBoundingClientRect(),settings=getSettings();
  const font=Number(settings.fontSize),advance=font*Number(settings.lineHeight);
  const row=Math.max(0,Math.min(settings.lineCount-1,Math.floor((rect.right-e.clientX)/advance)));
  const col=Math.max(0,Math.min(settings.charCount,Math.round((e.clientY-rect.top)/font)));
  const offset=gridOffsetAt(ta,row,col);
  if(ta.dataset.proxy==='1'){
    globalCaret=c.start+offset;globalSelEnd=globalCaret;
    ta.focus({preventScroll:true});ta.closest('.page').classList.add('editing');
    updateStatus();paintVertical(ta);scheduleReveal();
  }else{
    ta.setSelectionRange(offset,offset);syncCaret(ta);paintVertical(ta);
  }

// A real textarea is used for typing. A separate page-preview shows the
// strict grid when inactive; changing CSS while Japanese IME is active cannot
// create invisible newlines in the source text.
function createEditor(vertical){
  const ta=document.createElement('textarea');
  ta.className='page-editor';ta.spellcheck=false;
  ta.setAttribute('aria-label',vertical?'縦書き本文':'横書き本文');
  ta.setAttribute('autocorrect','off');ta.setAttribute('autocapitalize','off');
  ta.setAttribute('autocomplete','off');ta.setAttribute('wrap','soft');
  if(vertical)ta.dataset.proxy='1';
  return ta;
}
function replaceSelection(ta,text){
  const c=chunks[+ta.dataset.index];if(!c)return;
  const start=c.start+ta.selectionStart,end=c.start+ta.selectionEnd;
  remember();docText=docText.slice(0,start)+text+docText.slice(end);
  save();renderPages(start+text.length,start+text.length,true,true);
}
function syncCaret(ta){
  const c=chunks[+ta.dataset.index];if(!c)return;
  globalCaret=c.start+ta.selectionStart;
  globalSelEnd=c.start+ta.selectionEnd;
  updateStatus();

function syncFromPage(ta,focus,deferLayout=false){
  const i=+ta.dataset.index,c=chunks[i];if(!c)return;
  const localStart=ta.selectionStart,localEnd=ta.selectionEnd;
  const newText=ta.value.replace(/\r\n?/g,'\n');
  const oldLength=c.end-c.start;
  // Never overwrite newer data from a stale page/blur callback.
  if(docText.slice(c.start,c.end)!==c.text){
    if(!isComposing)renderPages(globalCaret,globalSelEnd,false,false);
    return;
  }
  if(newText===c.text){
    globalCaret=c.start+Math.min(localStart,newText.length);
    globalSelEnd=c.start+Math.min(localEnd,newText.length);
    updateStatus();paintVertical(ta);
    return;
  }
  docText=docText.slice(0,c.start)+newText+docText.slice(c.end);
  globalCaret=c.start+localStart;globalSelEnd=c.start+localEnd;
  save();
  if(deferLayout){
    const delta=newText.length-oldLength;
    c.text=newText;c.end+=delta;
    if(delta)for(let j=i+1;j<chunks.length;j++){
      chunks[j].start+=delta;chunks[j].end+=delta;
    }
    updateStatus();paintVertical(ta);scheduleIdleLayout(ta);
  }else renderPages(globalCaret,globalSelEnd,focus,true);

// Vertical writing's native IME control contains ONLY pending input, never the
// full manuscript. Its real caret is positioned at our on-paper grid caret.
// This avoids horizontal native caret/blue underline being drawn at top-left.
function proxyReplace(ta,text,at=globalCaret){
  const c=chunks[+ta.dataset.index];
  if(!c || !ta.isConnected)return;
  const insertion=Math.max(0,Math.min(at,docText.length));
  const start=insertion===globalCaret?Math.min(globalCaret,globalSelEnd):insertion;
  const end=insertion===globalCaret?Math.max(globalCaret,globalSelEnd):insertion;
  text=String(text).replace(/\r\n?/g,'\n');
  if(start===end && !text)return;
  remember();
  docText=docText.slice(0,start)+text+docText.slice(end);
  const next=start+text.length;
  globalCaret=globalSelEnd=next;
  save();renderPages(next,next,true,true);
}
function proxyDelete(ta,backward=true){
  const c=chunks[+ta.dataset.index];if(!c)return;
  const a=Math.min(globalCaret,globalSelEnd),b=Math.max(globalCaret,globalSelEnd);
  const from=a!==b?a:(backward?previousOffset(a):a);
  const to=a!==b?b:(backward?a:nextOffset(a));
  if(from===to)return;
  remember();docText=docText.slice(0,from)+docText.slice(to);
  globalCaret=globalSelEnd=from;save();renderPages(from,from,true,true);
}
function proxyArrow(ta,e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const c=chunks[+ta.dataset.index];if(!c)return;
  const stops=gridStops(c.text),offset=Math.max(0,Math.min(c.text.length,globalCaret-c.start));
  const pos=gridStopAtText(c.text,offset);
  let next=globalCaret;
  if(e.key==='ArrowUp')next=previousOffset(globalCaret);
  if(e.key==='ArrowDown')next=nextOffset(globalCaret);
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
    next=c.start+gridOffsetAt(ta,pos.row+(e.key==='ArrowLeft'?1:-1),pos.col);
  }
  next=Math.max(0,Math.min(docText.length,next));
  if(e.shiftKey){globalSelEnd=next}else{globalCaret=globalSelEnd=next}
  updateStatus();paintVertical(ta);scheduleReveal();
}
function bindProxyEditor(ta){
  if(ta.dataset.bound)return;ta.dataset.bound='1';
  ta.addEventListener('focus',()=>{
    ta.closest('.page')?.classList.add('editing');paintVertical(ta);
  });
  ta.addEventListener('compositionstart',()=>{
    isComposing=true;ta._compositionAnchor=globalCaret;
    ta._composeFinishing=false;remember();captureInputScroll();
    compositionScroll={...inputScroll};paintVertical(ta);
  });
  ta.addEventListener('compositionupdate',()=>{paintVertical(ta)});
  ta.addEventListener('compositionend',e=>{
    const fallback=e.data||'';
    ta._composeFinishing=true;
    // Safari may dispatch the final input AFTER compositionend.
    setTimeout(()=>{
      const value=ta.value.replace(/\r\n?/g,'\n')||fallback;
      ta.value='';isComposing=false;compositionScroll=null;

  // crossing page boundaries. Textarea selection handles Shift/IME itself.

  const vertical=getSettings().writingMode==='vertical';
  if(vertical && /^Arrow(Up|Down|Left|Right)$/.test(e.key)){
    e.preventDefault();
    const start=ta.selectionStart,stop=gridStopAt(ta,start),stops=gridStops(ta.value);
    let target=start;
    if(e.key==='ArrowDown')target=nextOffset(c.start+start)-c.start;
    if(e.key==='ArrowUp')target=previousOffset(c.start+start)-c.start;
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
      const row=stop.row+(e.key==='ArrowLeft'?1:-1);

       (target===start && ((e.key==='ArrowUp'&&start===0)||(e.key==='ArrowDown'&&start===ta.value.length)))){

  if(e.key===prev&&ta.selectionStart===0&&ta.selectionEnd===0&&i>0){
    e.preventDefault();renderPages(c.start,c.start,true,true);
    const prevPage=$('pages').children[i-1]?.firstElementChild;
    if(prevPage){prevPage.focus({preventScroll:true});prevPage.setSelectionRange(prevPage.value.length,prevPage.value.length);syncCaret(prevPage)}

    e.preventDefault();const nextPage=$('pages').children[i+1]?.firstElementChild;

function renderPages(caret=globalCaret,selEnd=globalSelEnd,focus=false,scroll=false){

  const container=$('pages');

  while(container.children.length>chunks.length)container.lastElementChild.remove();

  chunks.forEach((c,i)=>{
    let page=container.children[i];
    if(!page){page=document.createElement('div');container.appendChild(page);}
    const wasEditing=page.classList.contains('editing');
    page.className=pageClass()+(wasEditing?' editing':'');page.dataset.page=`${i+1}`;
    const vertical=getSettings().writingMode==='vertical';
    let ta=page.firstElementChild;
    if(!ta || ta.dataset.mode!==(vertical?'vertical':'horizontal')){
      ta=createEditor(vertical);ta.dataset.mode=vertical?'vertical':'horizontal';
      const preview=document.createElement('div');preview.className='page-preview';
      preview.setAttribute('aria-hidden','true');

      page.replaceChildren(ta,preview,gridCaret);bindEditor(ta);
      page.addEventListener('click',e=>{
        if(page.classList.contains('vertical'))verticalTap(page.firstElementChild,e);

    }
    ta.dataset.index=i;
    const layoutKey=c.text+'\u0000'+getSettings().charCount+'\u0000'+(vertical?'v':'h');

  globalSelEnd=Math.max(globalCaret,Math.min(end,docText.length));

// The editable page and the PDF must use the exact same pagination and
// grapheme-cell layout. A4 is fixed; reduce print font size only if needed
// to keep the chosen charCount x lineCount grid inside its printable area.
let lastPrintText=null,lastPrintSettings='';
function preparePrintPages(){
  const s=getSettings();
  const settingsKey=[s.fontSize,s.lineHeight,s.writingMode,s.charCount,s.lineCount].join('|');
  if(lastPrintText===docText && lastPrintSettings===settingsKey && $('printArea').firstElementChild)return;
  const pages=paginate(docText);
  const el=$('printArea');
  const mmPx=96/25.4;
  // Allow a safety margin for the iPad print engine while preserving
  // exactly the same column/row cells and screen-page boundaries.
  const vertical=s.writingMode==='vertical';
  // A4 portrait for horizontal writing; A4 landscape for vertical writing.
  // Both layouts reserve ample space for iPad's print headers and margins.
  const maxWidth=(vertical?246:165)*mmPx;
  const maxHeight=(vertical?146:201)*mmPx;
  const printRuleId='kotobaPrintPageSize';
  let printRule=document.getElementById(printRuleId);
  if(!printRule){printRule=document.createElement('style');printRule.id=printRuleId;document.head.append(printRule)}
  printRule.textContent=vertical
    ? '@page { size: A4 landscape; margin:14mm }'
    : '@page { size: A4 portrait; margin:18mm }';
  el.classList.toggle('vertical-print',vertical);
  const widthUnits=vertical?s.lineCount*Number(s.lineHeight):s.charCount;
  const heightUnits=vertical?s.charCount:s.lineCount*Number(s.lineHeight);
  const fitSize=Math.min(Number(s.fontSize),
    maxWidth*0.98/widthUnits,
    maxHeight*0.98/heightUnits);
  el.style.setProperty('--print-font-size',fitSize.toFixed(3)+'px');

  pages.forEach((chunk,i)=>{
    const sheet=document.createElement('section');
    sheet.className='print-sheet';
    sheet.setAttribute('aria-label',`原稿 ${i+1} / ${pages.length} ページ`);
    const body=document.createElement('div');
    body.className='print-preview'+(s.writingMode==='vertical'?' vertical':'');
    writeEditorText(body,chunk.text);
    sheet.append(body);
    const number=document.createElement('div');
    number.className='print-page-number';
    number.textContent=(i+1)+' / '+pages.length;
    sheet.append(number);
    fragment.append(sheet);
  });
  el.replaceChildren(fragment);
  lastPrintText=docText;
  lastPrintSettings=settingsKey;
}

function formatText(){
  let t=docText.replace(/\r\n?/g,'\n');
  t=t.split('\n').map(line=>line.replace(/[ \t]+$/g,'')).join('\n');
  t=t.replace(/\n{4,}/g,'\n\n\n');
  if($('indent').checked){
    t=t.split('\n').map(line=>{
      if(!line.trim())return '';
      if(/^[　「『（【〈《〔［｛]/.test(line))return line;
      return '　'+line.replace(/^[ 　]+/,'');
    }).join('\n');
  }
  setDoc(t,Math.min(globalCaret,t.length),Math.min(globalSelEnd,t.length),true,true);

function matches(q){

  while(p<=docText.length-q.length){
    const i=docText.indexOf(q,p);if(i<0)break;
    a.push(i);p=i+Math.max(1,q.length);
  }
  return a;
}
function clearSearchHighlight(){

function markSearchHighlight(start,end){

    const c=chunks[p];

  for(let i=searchVisibleCount;i<end;i++){
    const start=searchPositions[i];
    const b=document.createElement('button');b.type='button';b.className='search-hit';
    b.dataset.hitIndex=String(i);
    const meta=document.createElement('span');meta.className='search-meta';
    meta.textContent=`${i+1}件目 · ${pageForOffset(start)+1}ページ · 文字位置 ${start+1}`;
    b.append(meta,searchContextNode(start,q));
    b.setAttribute('aria-label',`${i+1}件目、${pageForOffset(start)+1}ページ、本文位置へ移動`);
    b.onclick=()=>selectSearchHit(i);
    fragment.appendChild(b);
  }
  list.append(fragment);searchVisibleCount=end;
  $('searchMore').style.display=end<searchPositions.length?'block':'none';
  $('searchMore').textContent=`さらに${Math.min(SEARCH_RESULT_BATCH,searchPositions.length-end)}件表示（${end}/${searchPositions.length}）`;
  updateSearchHitSelection();
}
function rebuildSearchResults(message=''){
  const q=$('findText').value;
  searchDocSnapshot=docText;searchQuerySnapshot=q;
  searchPositions=matches(q);searchSelectedIndex=-1;searchVisibleCount=0;
  currentMatch=null;searchPos=0;lastSearchQuery=q;
  $('searchResults').replaceChildren();clearSearchHighlight();
  $('findInfo').textContent=q?`${searchPositions.length}件`:'未検索';
  $('searchResultsSummary').textContent=q
    ? `${searchPositions.length}件見つかりました。結果を押すと、その原稿ページを表示します。`
    : '検索語を入力すると、該当箇所を一覧表示します。';
  $('searchPreview').textContent=message||(searchPositions.length?'結果を選んでから「選択した1件を置換」を押してください。':q?'一致する文字がありません。':'検索結果をここに表示します。');
  if(q && searchPositions.length)appendSearchHitBatch();
  else $('searchMore').style.display='none';
  updateSearchHitSelection();
}
function refreshSearchIfOutdated(){
  if(searchDocSnapshot!==docText || searchQuerySnapshot!==$('findText').value){
    rebuildSearchResults();return true;
  }
  return false;
}
function selectSearchHit(index){
  if(refreshSearchIfOutdated())return;
  if(index<0||index>=searchPositions.length)return;
  const q=searchQuerySnapshot,start=searchPositions[index];
  if(docText.slice(start,start+q.length)!==q){rebuildSearchResults('本文が更新されました。検索結果を選び直してください。');return;}
  searchSelectedIndex=index;currentMatch={start,end:start+q.length};searchPos=start+q.length;
  globalCaret=start;globalSelEnd=start+q.length;
  $('findInfo').textContent=`${index+1} / ${searchPositions.length}件`;
  $('searchPreview').textContent=`選択：${index+1}件目（${pageForOffset(start)+1}ページ） · 置換欄を編集すると、この1件だけを変更できます。`;
  markSearchHighlight(start,start+q.length);
  scrollToSearchMatch(start);
  updateSearchHitSelection();
}
function navigateSearch(direction){
  refreshSearchIfOutdated();
  if(!searchPositions.length)return false;
  const idx=searchSelectedIndex===-1
    ? (direction<0?searchPositions.length-1:0)
    : (searchSelectedIndex+direction+searchPositions.length)%searchPositions.length;
  while(idx>=searchVisibleCount)appendSearchHitBatch();
  selectSearchHit(idx);
  const button=$('searchResults').querySelector(`[data-hit-index="${idx}"]`);
  button?.scrollIntoView({block:'nearest',inline:'nearest'});
  return true;
}
function findNext(){return navigateSearch(1)}
function findPrev(){return navigateSearch(-1)}
$('findBtn').onclick=()=>{
  $('findPanel').classList.add('show');refreshSearchIfOutdated();$('findText').focus();
};
$('closeFind').onclick=()=>{$('findPanel').classList.remove('show');clearSearchHighlight()};
$('findText').oninput=()=>rebuildSearchResults();
$('prevBtn').onclick=findPrev;
$('nextBtn').onclick=findNext;
$('searchMore').onclick=appendSearchHitBatch;
$('goMatchBtn').onclick=()=>{
  if(refreshSearchIfOutdated()||!currentMatch)return;
  const match={...currentMatch};
  $('findPanel').classList.remove('show');clearSearchHighlight();
  globalCaret=match.start;globalSelEnd=match.end;
  renderPages(globalCaret,globalSelEnd,true,true);
};
$('replaceOneBtn').onclick=()=>{
  if(refreshSearchIfOutdated()||!currentMatch)return;
  const q=$('findText').value,r=$('replaceText').value;
  const m={...currentMatch};
  if(docText.slice(m.start,m.end)!==q){rebuildSearchResults('本文が変わりました。もう一度結果を選んでください。');return;}
  const next=docText.slice(0,m.start)+r+docText.slice(m.end);
  setDoc(next,m.start,m.start+r.length,true,false);
  rebuildSearchResults('指定した1件だけを置換しました。続ける場合は結果からもう一度選んでください。');
};
$('replaceAllBtn').onclick=()=>{
  const q=$('findText').value,r=$('replaceText').value;
  if(!q)return;
  refreshSearchIfOutdated();
  const n=searchPositions.length;
  if(!n)return;
  setDoc(docText.split(q).join(r),0,0,true,false);
  rebuildSearchResults(`${n}件をすべて置換しました。取り消しも利用できます。`);
};

let fullTextComposing=false,fullTextPagesDirty=false;
let fullTextSession=0,fullTextRevision=0,clipboardBusy=false;
function setClipboardBusy(busy){
  clipboardBusy=busy;
  for(const id of ['copyFullText','cutFullText','pasteFullText'])$(id).disabled=busy;
}
function fullTextSnapshot(){
  const field=$('fullText');
  return {session:fullTextSession,revision:fullTextRevision,text:field.value,start:field.selectionStart,end:field.selectionEnd};
}
function fullTextSnapshotValid(snapshot){
  const field=$('fullText');
  return !fullTextComposing && $('fullTextPanel').classList.contains('show') &&
    snapshot.session===fullTextSession && snapshot.revision===fullTextRevision &&
    snapshot.text===field.value && snapshot.start===field.selectionStart && snapshot.end===field.selectionEnd;
}
// Keep focus and native selection in the textarea when using the toolbar.
for(const id of ['reselectAll','copyFullText','cutFullText','pasteFullText','deleteFullText','undoFullText'])
  $(id).addEventListener('pointerdown',e=>{if(document.activeElement===$('fullText'))e.preventDefault();});
function selectEntireText(){
  if(fullTextComposing)return;
  const field=$('fullText');field.focus({preventScroll:true});field.setSelectionRange(0,field.value.length);
}
function syncFullText(){
  const field=$('fullText');
  const next=field.value.replace(/\r\n?/g,'\n');
  globalCaret=field.selectionStart;globalSelEnd=field.selectionEnd;
  if(next!==docText){
    docText=next;fullTextRevision++;fullTextPagesDirty=true;save();
  }
  // The textarea is the visible editor. Rebuilding thousands of hidden page
  // cells on every cut, paste and IME input blocks subsequent user actions.

}
function replaceFullSelection(text){
  if(fullTextComposing)return;
  const field=$('fullText');remember();
  field.setRangeText(text.replace(/\r\n?/g,'\n'),field.selectionStart,field.selectionEnd,'end');
  syncFullText();field.focus({preventScroll:true});
}
$('selectAllBtn').onclick=()=>{
  if(isComposing)return;
  $('findPanel').classList.remove('show');
  fullTextSession++;
  $('fullText').value=docText;$('fullTextStatus').textContent=clipboardBusy?'クリップボードの応答待ちです。長押し操作も使えます。':'';
  $('fullTextPanel').classList.add('show');selectEntireText();
};
$('reselectAll').onclick=selectEntireText;
$('fullText').addEventListener('beforeinput',e=>{
  if(e.inputType==='historyUndo' && !fullTextComposing){e.preventDefault();$('undoFullText').click();return;}
  if(!fullTextComposing)remember();
});
$('fullText').addEventListener('compositionstart',()=>{remember();fullTextComposing=true;});
$('fullText').addEventListener('compositionend',()=>{fullTextComposing=false;syncFullText();});
$('fullText').addEventListener('input',syncFullText);
$('fullText').addEventListener('keydown',e=>{
  if(!fullTextComposing && (e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='z' && !e.shiftKey){e.preventDefault();$('undoFullText').click();}
});
$('closeFullText').onclick=()=>{
  if(fullTextComposing)return;
  const field=$('fullText');syncFullText();fullTextSession++;$('fullTextPanel').classList.remove('show');
  renderPages(field.selectionStart,field.selectionEnd,true,true);fullTextPagesDirty=false;
};
$('deleteFullText').onclick=()=>replaceFullSelection('');
$('undoFullText').onclick=()=>{
  if(fullTextComposing || !history.length)return;
  const field=$('fullText'),pos=field.selectionStart;
  field.value=history.pop();field.setSelectionRange(Math.min(pos,field.value.length),Math.min(pos,field.value.length));
  syncFullText();field.focus({preventScroll:true});$('undoBtn').disabled=!history.length;
};
async function copyFullSelection(cut=false){
  if(fullTextComposing || clipboardBusy)return;
  const field=$('fullText'),snapshot=fullTextSnapshot();
  if(snapshot.end<=snapshot.start){$('fullTextStatus').textContent='コピーする範囲を選択してください。';return;}
  setClipboardBusy(true);$('fullTextStatus').textContent='コピー中…';
  try{
    let copied=false;
    try{await navigator.clipboard.writeText(snapshot.text.slice(snapshot.start,snapshot.end));copied=true;}catch{
      if(!fullTextSnapshotValid(snapshot))return;
      field.focus({preventScroll:true});field.setSelectionRange(snapshot.start,snapshot.end);
      try{copied=document.execCommand('copy');}catch{}
    }
    if(!fullTextSnapshotValid(snapshot))return;
    if(copied && cut)replaceFullSelection('');
    $('fullTextStatus').textContent=copied?'コピーしました。':'選択部分を長押しして「コピー」を選ぶか、キーボードのコピー操作を使ってください。';
  }finally{setClipboardBusy(false);}
}
$('copyFullText').onclick=()=>copyFullSelection(false);
$('cutFullText').onclick=()=>copyFullSelection(true);
$('pasteFullText').onclick=async()=>{
  if(fullTextComposing || clipboardBusy)return;
  const field=$('fullText'),snapshot=fullTextSnapshot();
  setClipboardBusy(true);$('fullTextStatus').textContent='貼り付けの許可・応答を待っています。';
  try{
    const text=await navigator.clipboard.readText();
    if(!fullTextSnapshotValid(snapshot)){
      if(snapshot.session===fullTextSession && $('fullTextPanel').classList.contains('show'))
        $('fullTextStatus').textContent='編集位置が変わりました。貼り付け先を選び直してください。';
      return;
    }
    replaceFullSelection(text);$('fullTextStatus').textContent='貼り付けました。';
  }catch{
    if(!fullTextSnapshotValid(snapshot))return;
    field.focus({preventScroll:true});
    $('fullTextStatus').textContent='入力欄を長押しして「ペースト」を選ぶか、キーボードの貼り付け操作を使ってください。';
  }finally{setClipboardBusy(false);}
};
/* 秘匿モード */
function syncPrivacy(){
  $('privacyBtn').textContent=privacyMode?'秘匿モード ON':'秘匿モード OFF';
  $('privacyBtn').classList.toggle('on',privacyMode);
  $('privacyBanner').classList.toggle('show',privacyMode);
}
async function tellSW(enabled){
  if(!('serviceWorker'in navigator))return;
  const reg=await navigator.serviceWorker.ready,target=navigator.serviceWorker.controller||reg.active;
  if(target)target.postMessage({type:'SET_OFFLINE_ONLY',enabled});
}
// 更新は利用者操作時のみ明示的に確認する。Safari自体によるSWの更新確認は止められない。
let updateRequestedByUser=false;
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!updateRequestedByUser)return;
    updateRequestedByUser=false;
    if(!isComposing)save();
    location.reload();
  });
}
$('checkAppUpdate').onclick=async()=>{
  if(privacyMode){alert('更新確認には通信が必要です。秘匿モードをOFFにしてからお試しください。');return;}
  if(!navigator.onLine){alert('更新確認にはインターネット接続が必要です。');return;}
  if(!('serviceWorker' in navigator)){alert('このブラウザでは更新確認を利用できません。');return;}
  const btn=$('checkAppUpdate');btn.disabled=true;
  try{
    const reg=await navigator.serviceWorker.getRegistration('./');
    if(!reg){alert('オフライン機能を準備中です。しばらくしてからお試しください。');return;}
    updateRequestedByUser=true;
    await reg.update();
    if(reg.installing){
      reg.installing.addEventListener('statechange',()=>{
        if(reg.installing?.state==='redundant')updateRequestedByUser=false;
      });
    }else if(!reg.waiting){
      updateRequestedByUser=false;
      alert('更新確認が完了しました。新しい版が公開された場合は、次回の起動時にも反映されます。');
    }
  }catch(e){
    updateRequestedByUser=false;
    alert('更新を確認できませんでした。ネット接続を確認してください。');
  }finally{btn.disabled=false;}
};
// Safariで利用条件のiframeが白くなる場合があるため、同一オリジンのHTMLを
// 読み取って本文をアプリ内へ表示する。書き込み対象は利用条件パネルのみ。
// オフラインと秘匿モードではCacheStorageから読むため、通信を発生させない。
let licensesReadToken=0;
async function openLicensesPanel(){
  const token=++licensesReadToken;
  const panel=$('licensesPanel');
  const content=$('licensesContent');
  const status=$('licensesStatus');
  panel.classList.add('show');
  content.replaceChildren();
  content.scrollTop=0;
  status.textContent='利用条件を読み込んでいます…';
  const localOnly=privacyMode||!navigator.onLine;
  try{
    let response;
    if(localOnly){
      if(!('caches' in window))throw new Error('キャッシュ機能がありません');
      response=await caches.match('./licenses.html');
      if(!response)throw new Error('保存済みの利用条件がありません');
    }else{
      try{
        response=await fetch('./licenses.html?refresh='+Date.now(),{cache:'no-store'});
        if(!response.ok)throw new Error('HTTP '+response.status);
      }catch(error){
        response=('caches' in window)?await caches.match('./licenses.html'):null;
        if(!response)throw error;
      }
    }
    if(!response||!response.ok)throw new Error('利用条件を取得できませんでした');
    const html=await response.text();
    const parsed=new DOMParser().parseFromString(html,'text/html');
    if(!parsed.body.querySelector('h1')||!parsed.body.textContent.includes('Kotoba Writer')){
      throw new Error('利用条件の形式を確認できませんでした');
    }
    // 外部由来のコードが実行されないよう、表示用の要素のみ残す。
    parsed.body.querySelectorAll('script,style,iframe,object,embed,form,link').forEach(el=>el.remove());
    parsed.body.querySelectorAll('*').forEach(el=>{
      [...el.attributes].forEach(attr=>{
        if(/^on/i.test(attr.name)||attr.name==='srcdoc')el.removeAttribute(attr.name);
      });
    });
    if(token!==licensesReadToken)return;
    content.replaceChildren(...Array.from(parsed.body.childNodes).map(n=>document.importNode(n,true)));
    status.textContent=localOnly?'保存済みの利用条件を表示しています。':' ';
  }catch(error){
    if(token!==licensesReadToken)return;
    status.textContent='利用条件を表示できませんでした。上の「利用条件を別タブで開く」をお試しください。';
  }
}
$('licensesBtn').onclick=openLicensesPanel;
$('closeLicenses').onclick=()=>{
  ++licensesReadToken;
  $('licensesPanel').classList.remove('show');
};
$('privacyBtn').onclick=async()=>{
  if(!privacyMode){
    privacyMode=true;
  }else{
    if(!confirm('秘匿モードをOFFにしますか？'))return;
    privacyMode=false;
  }
  localStorage.setItem('kotoba-writer-privacy',privacyMode?'1':'0');syncPrivacy();
  try{await tellSW(privacyMode)}catch{}
};

['fontSize','lineHeight','writingMode','manuscript','indent','charCount','lineCount'].forEach(id=>$(id).addEventListener('change',applySettings));
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{
  const [c,l]=b.dataset.preset.split(',');$('charCount').value=c;$('lineCount').value=l;applySettings();
});
window.addEventListener('pagehide',()=>{if(!isComposing)save()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&!isComposing)save()});

viewportChanged();
syncFileName();
loadSettings();
applySettings();
syncPrivacy();
renderPages(0,0,false,false);

if('serviceWorker'in navigator){
  navigator.serviceWorker.register('./sw.js?v='+BUILD,{updateViaCache:'none'}).then(async r=>{
    // ブラウザ標準のSW更新確認は残るが、起動毎の明示的なr.update()は実行しない。
    try{await navigator.serviceWorker.ready;await tellSW(privacyMode)}catch{}
  }).catch(()=>{});
}
